# Application Configuration
spring.application.name=inventory-management
server.port=8080

# PostgreSQL Database Configuration (Supabase)
spring.datasource.url=jdbc:postgresql://db.hrgdanwvxjevwnpzgheo.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=your_actual_password_here
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
